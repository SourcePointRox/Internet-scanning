<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetAtlas · 互联网扫描管控台</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --border:#e3e8ef; --text:#1a2233; --muted:#6b7686;
    --accent:#2b6cb0; --ok:#2f9e44; --warn:#e8590c; --danger:#e03131; --code:#f1f4f9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
  header h1{font-size:18px;font-weight:600}
  header .badge{font-size:12px;padding:2px 10px;border-radius:10px;background:var(--code);color:var(--muted)}
  header .badge.on{background:#d3f9d8;color:var(--ok)}
  main{max-width:1280px;margin:20px auto;padding:0 16px;display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
  .card h2{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
  .span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}
  .stat{font-size:26px;font-weight:700}
  .stat-label{font-size:12px;color:var(--muted);margin-top:2px}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row .name{flex:1;font-weight:500}
  .dot{width:9px;height:9px;border-radius:50%;background:#adb5bd;display:inline-block;margin-right:6px}
  .dot.on{background:var(--ok)}
  .btn{border:1px solid var(--border);background:var(--card);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:13px}
  .btn:hover{background:var(--code)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.danger{color:var(--danger)}
  input[type=range]{width:100%}
  .slider-val{font-variant-numeric:tabular-nums;font-weight:600;min-width:70px;text-align:right}
  .path{font-family:Consolas,monospace;font-size:12px;background:var(--code);border-radius:6px;padding:6px 10px;word-break:break-all;margin-top:4px;color:#364152}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600}
  canvas{width:100%;height:160px}
  #ws-status{font-size:12px;color:var(--muted);margin-left:auto}
  .quota-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
  @media(max-width:900px){.span4,.span6,.span8{grid-column:span 12}}
</style>
</head>
<body>
<header>
  <h1>NetAtlas 互联网扫描管控台</h1>
  <span id="mode-badge" class="badge">--</span>
  <span id="ws-status">连接中…</span>
</header>
<main>
  <!-- 全局控制 -->
  <div class="card span12">
    <h2>全局控制</h2>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn primary" onclick="pipeline('start')">▶ 启动全部流水线</button>
      <button class="btn danger" onclick="pipeline('stop')">■ 停止全部流水线</button>
      <span style="flex:1"></span>
      <label>上行带宽 (Mbps)</label>
      <input type="range" id="bw-upload" min="1" max="100" step="1" style="width:180px" oninput="bwChange()">
      <span class="slider-val" id="bw-upload-val">25</span>
      <label>全局占用上限 (%)</label>
      <input type="range" id="bw-cap" min="5" max="100" step="5" style="width:140px" oninput="bwChange()">
      <span class="slider-val" id="bw-cap-val">80%</span>
    </div>
  </div>

  <!-- 实时吞吐 -->
  <div class="card span8">
    <h2>实时吞吐 · 网卡级真实计量 (Mbps · 5s 窗口)</h2>
    <canvas id="tp-chart" width="800" height="160"></canvas>
    <div id="tp-legend" style="display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:6px"></div>
  </div>

  <!-- 队列深度 -->
  <div class="card span4">
    <h2>流水线队列深度（背压监控）</h2>
    <div id="queues"></div>
  </div>

  <!-- 实时扫描信息流 -->
  <div class="card span12">
    <h2>实时扫描信息流（含分类 · 最新在下 · 自动滚动）</h2>
    <div id="feed-box" style="height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">
      <table id="feed-table" style="font-size:12px">
        <thead style="position:sticky;top:0;background:var(--card)"><tr>
          <th>时间</th><th>IP:端口</th><th>协议</th><th>域名/反解</th><th>分类（悬停看完整层级）</th><th>标题 / Server</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- 模块控制 -->
  <div class="card span6">
    <h2>模块启停</h2>
    <div id="modules"></div>
  </div>

  <!-- 带宽配额 -->
  <div class="card span6">
    <h2>模块带宽配额 (Mbps)</h2>
    <div class="quota-grid" id="quotas"></div>
  </div>

  <!-- 分类统计 -->
  <div class="card span6">
    <h2>站点分类 TOP（最小子类）</h2>
    <table id="class-table"><thead><tr><th>分类</th><th style="text-align:right">站点数</th></tr></thead><tbody></tbody></table>
  </div>

  <!-- 存储路径 -->
  <div class="card span6">
    <h2>存储层 · 实时本地路径</h2>
    <div id="storage"></div>
  </div>

  <!-- 只读查询 -->
  <div class="card span12">
    <h2>即席查询（DuckDB · 只读 SELECT · Parquet 列式层）</h2>
    <div style="display:flex;gap:8px">
      <input id="sql" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:Consolas,monospace"
             placeholder='SELECT * FROM hosts LIMIT 10' value="SELECT * FROM hosts LIMIT 10">
      <button class="btn primary" onclick="runQuery()">执行</button>
    </div>
    <div id="query-result" style="margin-top:10px;overflow-x:auto"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const series = {up: [], down: []}; // 网卡级真实上/下行 Mbps
const MAX_POINTS = 120;
const COLORS = {up:'#2b6cb0', down:'#2f9e44'};
const CAT_COLORS = ['#2b6cb0','#2f9e44','#e8590c','#9c36b5','#0c8599','#e03131'];
function catColor(cat){ let h=0; for(const c of cat) h=(h*31+c.charCodeAt(0))>>>0; return CAT_COLORS[h%CAT_COLORS.length]; }
const esc = s => (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let ws;
function connectWs(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => $('#ws-status').textContent = '● 实时连接正常';
  ws.onmessage = ev => { const d = JSON.parse(ev.data); renderLive(d); };
  ws.onclose = () => { $('#ws-status').textContent = '○ 连接断开，2s 后重连'; setTimeout(connectWs, 2000); };
}

function renderLive(d){
  // 网卡级真实吞吐序列
  const nic = d.nic || {};
  series.up.push(nic.up_mbps||0); if(series.up.length>MAX_POINTS) series.up.shift();
  series.down.push(nic.down_mbps||0); if(series.down.length>MAX_POINTS) series.down.shift();
  drawChart();
  $('#tp-legend').innerHTML =
    `<span><span style="color:${COLORS.up}">■</span> 上行: ${(nic.up_mbps||0).toFixed(2)} Mbps</span>`+
    `<span><span style="color:${COLORS.down}">■</span> 下行: ${(nic.down_mbps||0).toFixed(2)} Mbps</span>`;
  // 实时信息流（增量追加，自动滚动）
  if(d.feed && d.feed.length) appendFeed(d.feed);
  // 队列
  $('#queues').innerHTML = Object.entries(d.queues||{}).map(([k,v]) =>
    `<div class="row"><span class="name">${k}</span><span class="slider-val">${v.toLocaleString()}</span></div>`).join('');
  // 模块
  $('#modules').innerHTML = Object.entries(d.modules||{}).map(([name,m]) => `
    <div class="row">
      <span class="dot ${m.running?'on':''}"></span><span class="name">${name}</span>
      <span style="color:var(--muted);font-size:12px">${m.running?('运行 '+m.uptime_s+'s'):'已停止'}
        ${m.counters?(' · '+Object.entries(m.counters).slice(0,3).map(([k,v])=>k+':'+v).join(' ')):''}</span>
      ${m.running
        ? `<button class="btn danger" onclick="mod('${name}','stop')">停止</button>`
        : `<button class="btn" onclick="mod('${name}','start')">启动</button>`}
    </div>`).join('');
  // 带宽配额（只在值变化时刷新，避免打断拖动）
  const q = d.bandwidth.quotas_mbps||{};
  if(!$('#quotas').dataset.init){
    $('#quotas').dataset.init = 1;
    $('#quotas').innerHTML = Object.entries(q).map(([k,v]) => `
      <div><label>${k}</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="range" min="0.5" max="20" step="0.5" value="${v}" oninput="quotaChange('${k}',this.value);this.nextElementSibling.textContent=this.value">
          <span class="slider-val">${v}</span></div></div>`).join('');
    $('#bw-upload').value = d.bandwidth.upload_mbps; $('#bw-upload-val').textContent = d.bandwidth.upload_mbps;
    $('#bw-cap').value = d.bandwidth.cap_pct; $('#bw-cap-val').textContent = d.bandwidth.cap_pct+'%';
  }
}

const FEED_MAX = 300;
function appendFeed(items){
  const tbody = $('#feed-table tbody');
  const html = items.map(e => {
    const t = new Date(e.ts*1000).toLocaleTimeString('zh-CN', {hour12:false});
    const cat = e.category || 'Unknown';
    const chip = `<span style="color:#fff;background:${catColor(cat)};border-radius:8px;padding:1px 8px;font-size:11px;white-space:nowrap">${esc(cat)}</span>`;
    return `<tr>
      <td style="color:var(--muted);white-space:nowrap">${t}</td>
      <td style="font-family:Consolas,monospace;white-space:nowrap">${esc(e.ip)}:${e.port??''}</td>
      <td>${esc(e.protocol||'')}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.domain||'')}</td>
      <td title="${esc(e.category_path||'')}" style="cursor:help">${chip}</td>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)">${esc(e.title||'')}</td>
    </tr>`;
  }).join('');
  tbody.insertAdjacentHTML('beforeend', html);
  while(tbody.rows.length > FEED_MAX) tbody.deleteRow(0);
  const box = $('#feed-box');
  box.scrollTop = box.scrollHeight;  // 自动滚动到最新
}

function drawChart(){
  const c = $('#tp-chart'), ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const all = [...series.up, ...series.down];
  const max = Math.max(1, ...all) * 1.2;
  ctx.strokeStyle = '#e3e8ef';
  for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(0,c.height*i/4); ctx.lineTo(c.width,c.height*i/4); ctx.stroke(); }
  // 纵轴刻度
  ctx.fillStyle = '#6b7686'; ctx.font = '10px sans-serif';
  for(let i=1;i<4;i++){ ctx.fillText((max*(4-i)/4).toFixed(1)+'M', 4, c.height*i/4 - 3); }
  Object.entries(series).forEach(([k,arr]) => {
    ctx.strokeStyle = COLORS[k]||'#333'; ctx.lineWidth = 1.6; ctx.beginPath();
    arr.forEach((v,i)=>{ const x=i/(MAX_POINTS-1)*c.width, y=c.height-(v/max)*c.height; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
  });
}

async function api(path, method='GET', body){
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  return r.json();
}
function mod(name, action){ api(`/api/modules/${name}/${action}`,'POST'); }
function pipeline(action){ api(`/api/pipeline/${action}`,'POST'); }
function bwChange(){
  $('#bw-upload-val').textContent = $('#bw-upload').value;
  $('#bw-cap-val').textContent = $('#bw-cap').value+'%';
  api('/api/bandwidth','POST',{upload_mbps:+$('#bw-upload').value, cap_pct:+$('#bw-cap').value});
}
function quotaChange(k,v){ api('/api/bandwidth','POST',{quotas:{[k]:+v}}); }

async function refreshStatic(){
  const st = await api('/api/status');
  $('#mode-badge').textContent = st.dry_run ? 'DRY-RUN 模拟模式' : ('L7引擎: '+st.engine_l7);
  $('#mode-badge').classList.toggle('on', !st.dry_run);
  $('#storage').innerHTML = Object.entries(st.storage||{}).map(([k,v]) => `
    <div style="margin-bottom:10px"><b>${k}</b> · ${v.size_mb} MB · ${v.files} 个文件
      <div class="path">${v.path}</div></div>`).join('');
  const cs = await api('/api/classification/stats');
  $('#class-table tbody').innerHTML = (cs.top_categories||[]).map(([c,n]) =>
    `<tr><td>${c}</td><td style="text-align:right">${n}</td></tr>`).join('') || '<tr><td colspan=2 style="color:var(--muted)">暂无分类数据</td></tr>';
}

async function runQuery(){
  const sql = $('#sql').value;
  const r = await api('/api/query?sql='+encodeURIComponent(sql));
  if(r.error){ $('#query-result').innerHTML = `<div class="path" style="color:var(--danger)">${r.error}</div>`; return; }
  $('#query-result').innerHTML = '<table><thead><tr>'+r.columns.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+
    r.rows.map(row=>'<tr>'+row.map(v=>`<td>${(v??'').toString().slice(0,120)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
}

async function initFeed(){
  // 页面打开时先拉取最近 50 条历史，之后由 WebSocket 增量推送
  const r = await api('/api/feed?n=50');
  if(r.items && r.items.length) appendFeed(r.items);
}

connectWs();
refreshStatic();
initFeed();
setInterval(refreshStatic, 5000);
</script>
</body>
</html>
