# ZGrab2 多协议配置（zgrab2 multiple -c 使用）
# 目标 CSV 行中的 tag 决定使用哪个模块；tag 由 l7_grabber.ZGRAB2_MODULE 映射得到。
# 注意：zgrab2 v0.1.8 无 https 模块，HTTPS 端口走 [tls] 抓取证书链。

[Application Options]
senders = 512
connections-per-host = 1

[http]
port = 80
endpoint = /
max-redirects = 2

[tls]
port = 443
heartbleed = false

[ssh]
port = 22

[ftp]
port = 21

[smtp]
port = 25

[telnet]
port = 23

[pop3]
port = 110

[imap]
port = 143

[mysql]
port = 3306

[redis]
port = 6379

[mongodb]
port = 27017

[postgres]
port = 5432

[mssql]
port = 1433

[ntp]
port = 123

